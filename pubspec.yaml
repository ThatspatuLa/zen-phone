name: zen_phone
description: "Zen Phone — Agent OS on iPhone. Operator-facing phone UI for the Zen project fleet."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP + state
  http: ^1.2.2
  provider: ^6.1.2

  # Persistent storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Speech-to-text on iOS (Apple Speech Recognition — no backend needed)
  speech_to_text: ^7.0.0

  # Local notifications (no Apple Developer account required)
  flutter_local_notifications: ^17.2.3

  # Markdown rendering
  flutter_markdown: ^0.7.4

  # Time formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
