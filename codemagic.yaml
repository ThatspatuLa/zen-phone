workflows:
  release-ios:
    name: Zen Phone iOS Release
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build iOS release (no codesign)
        script: |
          flutter build ipa --release --no-codesign
      - name: Verify IPA
        script: |
          ls -la build/ios/ipa/ 2>/dev/null || ls -la build/ios/Release-iphoneos/
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/Release-iphoneos/Runner.app
    publishing:
      scripts:
        - name: Skip App Store
          script: |
            echo "Sideloading via AltStore — no App Store publish"
